name: Validate Content

on:
  pull_request:
    paths:
      - 'people/**'
      - 'src/**'
      - 'package.json'
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Validation Script
        run: npx tsx scripts/validate.ts

      - name: Build Project
        run: npm run build
